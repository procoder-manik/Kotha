name: Build Kotha for macOS
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon (M1/M2/M3/M4)
            arch: AppleSilicon
          - os: macos-15-intel        # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .dmg
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kotha-Mac-${{ matrix.arch }}
          path: output/*.dmg
