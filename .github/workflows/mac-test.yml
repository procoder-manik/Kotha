name: Mac self-test
# Runs Kotha on real macOS machines: from source, then as the packaged .app, opening every window.
# Results appear as annotations on the run. Start it by pushing a branch named mactest/<anything>.
on:
  push:
    branches: ["mactest/**"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Self-test from source
        run: |
          set +e
          python kotha.py --selftest --ui > out_src.txt 2>&1 &
          pid=$!
          for i in $(seq 1 150); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then echo "TIMEOUT: still running after 150s" >> out_src.txt; kill -9 $pid; else wait $pid; echo "process exit code $?" >> out_src.txt; fi
          echo "---- stdout"; cat out_src.txt
          LOG="$HOME/Library/Application Support/Kotha/kotha.log"
          { echo "SOURCE SELFTEST ${{ matrix.os }}"; grep -v ObjCPointer out_src.txt; echo "---- log"; tail -12 "$LOG" 2>/dev/null; echo "exit/kill status: $?"; } > ann_src.txt
          msg=$(tr -d '\r' < ann_src.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-8000)
          echo "::notice title=source-selftest::$msg"
      - name: Build the app
        run: bash build_mac.sh
      - name: Self-test the packaged app (3 runs)
        run: |
          set +e
          : > out_app.txt
          for run in 1 2 3; do
            dist/Kotha.app/Contents/MacOS/Kotha --selftest --ui > one.txt 2>&1 &
            pid=$!
            for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then echo "run $run: TIMEOUT"; grep -v ObjCPointer one.txt | tail -25; kill -9 $pid; else wait $pid; echo "run $run: exit $?"; grep -E "recorder|windows|RESULT|FAIL" one.txt; fi >> out_app.txt
          done
          cat out_app.txt
          { echo "APP SELFTEST ${{ matrix.os }}"; cat out_app.txt; } > ann_app.txt
          msg=$(tr -d '\r' < ann_app.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-8000)
          echo "::notice title=app-selftest::$msg"
